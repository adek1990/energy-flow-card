# =============================================================================
# Energy Flow Card — pełna konfiguracja
# Fronius Symo (2 falowniki) + Smart Meter 63A + Shelly Pro 3EM + 13× Sonoff Dual R3
#
# Zasada: `power` = moc chwilowa (W/kW), `energy` = licznik narastający (kWh).
# Moc i energia domu liczone z bilansu (auto), a różnica względem opomiarowanych
# odbiorników trafia do węzła "Niezmierzone".
#
# Po wgraniu sprawdź konsolę przeglądarki (F12) — karta wypisuje każde nieistniejące
# entity_id, a w interfejsie pokazuje przy nim „brak encji".
# =============================================================================

type: custom:energy-flow-card
title: Przepływ energii
subtitle: Fronius Symo · Smart Meter 63A
theme_mode: auto
language: auto
animate: true
legend: true
history: true
layout_button: true
idle_threshold: 15

solar:
  name: Fotowoltaika łącznie
  power: sensor.pv_total_power
  energy: sensor.pv_total_energy_today
  # Moc znamionowa AC obu falowników — daje procent wykorzystania przy sumie.
  # SPRAWDŹ: to ma być moc falowników, nie paneli.
  max_power: 24900
  # Strona AC — z samego falownika, nie z licznika (licznik widzi cały dom).
  voltage: sensor.falownik_1_napiecie_pradu_zmiennego
  current: sensor.falownik_1_prad_zmienny
  frequency: sensor.falownik_1_czestotliwosc
  status: sensor.falownik_1_status_message
  strings:
    - name: Falownik 1
      icon: panel
      power: sensor.solarnet_1_fotowoltaika
      energy: sensor.falownik_1_energia_z_dnia
      voltage: sensor.falownik_1_napiecie_pradu_stalego
      current: sensor.falownik_1_prad_staly
      max_power: 14900
    - name: Falownik 2
      icon: panel
      power: sensor.solarnet_2_fotowoltaika
      energy: sensor.falownik_2_energia_z_dnia
      voltage: sensor.falownik_2_napiecie_pradu_stalego
      current: sensor.falownik_2_prad_staly
      max_power: 10000

grid:
  name: Sieć
  # Dwie encje kierunkowe zamiast jednej ze znakiem — nie da się pomylić kierunku.
  power_import: sensor.solarnet_1_power_grid_import
  power_export: sensor.solarnet_1_power_grid_export
  # Alternatywa (jedna encja ze znakiem, ujemna = oddawanie, bez `invert`):
  #   power: sensor.smart_meter_63a_realna_moc
  #
  # Liczniki Energi są DZIENNE i rozbite na strefy taryfowe — karta sumuje listę.
  # "consumed" = pobór z sieci, "produced" = oddanie do sieci.
  energy_import:
    - sensor.energa_my_meter_30985961_consumed_strefa_1_dzienna
    - sensor.energa_my_meter_30985961_consumed_strefa_2_nocna
  energy_export:
    - sensor.energa_my_meter_30985961_produced_strefa_1_dzienna
    - sensor.energa_my_meter_30985961_produced_strefa_2_nocna
  # Liczniki Froniusa są od uruchomienia instalacji (38,66 / 35,21 MWh) — nie nadają się:
  #   energy_import: sensor.smart_meter_63a_energia_rzeczywista_plus
  #   energy_export: sensor.smart_meter_63a_energia_rzeczywista_minus

house:
  name: Dom
  # `auto` = bilans: fotowoltaika + sieć − akumulator.
  # Suma odbiorników dawała 21 W przy 16,7 kW produkcji i 6,64 kW oddawania,
  # bo opomiarowany jest ułamek instalacji. Bilans pokazuje realne ~10 kW.
  #
  # Alternatywy:
  #   (usuń linię)                        → suma moc urządzeń z grup poniżej
  #   power: sensor.solarnet_1_obciazenie → zużycie domu wprost z Froniusa
  #                                         (SPRAWDŹ znak; jeśli ujemny → `invert: true`)
  # NIE UŻYWAJ sensor.solarnet_1_power_load_consumed — zwraca stałe 0 W.
  power: auto
  self_sufficiency: sensor.solarnet_1_autonomia_wzgledna
  # "auto" = produkcja PV + pobór z sieci − oddanie do sieci.
  # To jedyny sposób na realne zużycie domu, bo licznik Froniusa jest od uruchomienia instalacji.
  energy: auto
  # Reszta domu poza opomiarowanymi grupami — osobny węzeł na szynie odbiorników:
  unmetered:
    name: Niezmierzone
    icon: house

groups:
  - name: Wentylacja
    icon: fan
    expanded: true
    devices:
      - name: Rekuperator
        icon: fan
        # SPRAWDŹ: sensor.rekuperator_dzis to dzienny licznik energii (mimo kW i device_class: power).
        # Encja mocy chwilowej — ta, z której liczony jest ten licznik:
        # power: sensor.rekuperator_moc
        energy: sensor.rekuperator_dzis

  - name: Ogrzewanie
    icon: climate
    expanded: true
    devices:
      - name: Pompa ciepła
        icon: climate
        # SPRAWDŹ: Shelly Pro 3EM mierzy 3 fazy — ta encja może być tylko jedną z nich.
        # Suma trzech faz to zwykle sensor.shellypro3em_..._total_active_power
        power: sensor.shellypro3em_fce8c0daec00_power
        # UWAGA: 620,6 kWh to licznik od podłączenia Shelly, nie „dzisiaj" —
        # zaniża węzeł "Niezmierzone". Zrób utility_meter dobowy (blok na końcu pliku).
        energy: sensor.shellypro3em_fce8c0daec00_energy

  # Każdy moduł pokazuje sumę obu kanałów i rozwija je po kliknięciu.
  - name: Gniazdka Sonoff
    icon: plug
    devices:
      - name: H kampy
        icon: plug
        devices:
          - name: Lampy
            icon: bulb
            power: sensor.sonoff_dual_r3_1_power_1
            energy: sensor.sonoff_dual_r3_1_energy_1_daily
          - name: Podświetlacze
            icon: bulb
            power: sensor.sonoff_dual_r3_1_power_2
            energy: sensor.sonoff_dual_r3_1_energy_2_daily

      - name: Klony
        icon: plug
        devices:
          - name: Klony
            icon: bulb
            power: sensor.sonoff_dual_r3_2_power_1
            energy: sensor.sonoff_dual_r3_2_energy_1_daily
          - name: zew. przy drzwwiach do domu
            icon: bulb
            power: sensor.sonoff_dual_r3_2_power_2
            energy: sensor.sonoff_dual_r3_2_energy_2_daily

      - name: Sonoff 3
        icon: plug
        devices:
          - name: 1
            power: sensor.sonoff_dual_r3_3_power_1
            energy: sensor.sonoff_dual_r3_3_energy_1_daily
          - name: 2
            power: sensor.sonoff_dual_r3_3_power_2
            energy: sensor.sonoff_dual_r3_3_energy_2_daily

      - name: Sonoff 4
        icon: plug
        devices:
          - name: Napowietrzanie stawu
            icon: water
            power: sensor.sonoff_dual_r3_4_power_1
            energy: sensor.sonoff_dual_r3_4_energy_1_daily
          - name: Gniazdko przy falowniku
            power: sensor.sonoff_dual_r3_4_power_2
            energy: sensor.sonoff_dual_r3_4_energy_2_daily

      - name: Tył
        icon: plug
        devices:
          - name: 1
            power: sensor.sonoff_dual_r3_5_power_1
            energy: sensor.sonoff_dual_r3_5_energy_1_daily
          - name: Tył domu
            icon: bulb
            power: sensor.sonoff_dual_r3_5_power_2
            energy: sensor.sonoff_dual_r3_5_energy_2_daily

      - name: Lampy
        icon: bulb
        devices:
          - name: Przy śmietniku
            icon: bulb
            power: sensor.sonoff_dual_r3_6_power_1
            energy: sensor.sonoff_dual_r3_6_energy_1_daily
          - name: Przy furtce
            icon: bulb
            power: sensor.sonoff_dual_r3_6_power_2
            energy: sensor.sonoff_dual_r3_6_energy_2_daily

      - name: Sonoff 7
        icon: plug
        devices:
          - name: 1
            power: sensor.sonoff_dual_r3_7_power_1
            energy: sensor.sonoff_dual_r3_7_energy_1_daily
          - name: 2
            power: sensor.sonoff_dual_r3_7_power_2
            energy: sensor.sonoff_dual_r3_7_energy_2_daily

      - name: Sonoff 8
        icon: plug
        devices:
          - name: 1
            power: sensor.sonoff_dual_r3_8_power_1
            energy: sensor.sonoff_dual_r3_8_energy_1_daily
          - name: 2
            power: sensor.sonoff_dual_r3_8_power_2
            energy: sensor.sonoff_dual_r3_8_energy_2_daily

      - name: Sonoff 9
        icon: plug
        devices:
          - name: Napowietrzanie stawu
            icon: water
            power: sensor.sonoff_dual_r3_9_power_1
            energy: sensor.sonoff_dual_r3_9_energy_1_daily
          - name: Gniazdko przy falowniku
            power: sensor.sonoff_dual_r3_9_power_2
            energy: sensor.sonoff_dual_r3_9_energy_2_daily

      - name: Sonoff 10
        icon: plug
        devices:
          - name: 1
            power: sensor.sonoff_dual_r3_10_power_1
            energy: sensor.sonoff_dual_r3_10_energy_1_daily
          - name: Kinkiet Piwniczka
            icon: bulb
            power: sensor.sonoff_dual_r3_10_power_2
            energy: sensor.sonoff_dual_r3_10_energy_2_daily

      - name: Altana
        icon: bulb
        devices:
          - name: Środek tył
            icon: bulb
            power: sensor.sonoff_dual_r3_11_power_1
            energy: sensor.sonoff_dual_r3_11_energy_1_daily
          - name: Boki
            icon: bulb
            power: sensor.sonoff_dual_r3_11_power_2
            energy: sensor.sonoff_dual_r3_11_energy_2_daily

      - name: Staw 1
        icon: water
        devices:
          - name: Murki
            icon: bulb
            power: sensor.sonoff_dual_r3_12_power_1
            energy: sensor.sonoff_dual_r3_12_energy_1_daily
          - name: Schody
            icon: bulb
            power: sensor.sonoff_dual_r3_12_power_2
            energy: sensor.sonoff_dual_r3_12_energy_2_daily

      - name: Staw 2
        icon: water
        devices:
          - name: Podświetlacze
            icon: bulb
            power: sensor.sonoff_dual_r3_13_power_1
            energy: sensor.sonoff_dual_r3_13_energy_1_daily
          - name: Ścieżka
            icon: bulb
            power: sensor.sonoff_dual_r3_13_power_2
            energy: sensor.sonoff_dual_r3_13_energy_2_daily

grid_options:
  columns: full
  rows: auto

# =============================================================================
# OPCJONALNIE — poprawka błędnej klasy licznika rekuperatora (customize.yaml):
#   sensor.rekuperator_dzis:
#     device_class: energy
#     unit_of_measurement: kWh
#
# Dzienny licznik pompy ciepła (Shelly liczy od podłączenia) — configuration.yaml:
#   utility_meter:
#     pompa_ciepla_daily:
#       source: sensor.shellypro3em_fce8c0daec00_energy
#       cycle: daily
#   → potem: groups[Ogrzewanie].devices[Pompa ciepła].energy: sensor.pompa_ciepla_daily
# =============================================================================
