# Port konfiguracji z sunsynk-power-flow-card (Fronius Symo + Smart Meter 63A + Sonoff/Shelly)
# Akumulator pominięty — w źródłowej konfiguracji było show_battery: false.
#
# Zasada: pole `power` = moc chwilowa (W/kW), pole `energy` = licznik narastający (kWh).
# Węzeł domu sumuje moc wszystkich urządzeń z grup poniżej.
#
# DO SPRAWDZENIA po wgraniu — karta sama wypisze w konsoli (F12) każde błędne id
# jako „brak encji", więc wystarczy zerknąć tam po odświeżeniu:
#   1. sensor.sonoff_dual_r3_*_power_1 / _power_2  — nazwy wg wzorca integracji SonoffLAN,
#   2. sensor.shellypro3em_fce8c0daec00_power      — w części wersji: _total_active_power,
#   3. moc rekuperatora — encja źródłowa licznika sensor.rekuperator_dzis,
#   4. kierunek sieci — patrz komentarz przy `grid:`.

type: custom:energy-flow-card
title: Przepływ energii
subtitle: Fronius Symo · Smart Meter 63A
theme_mode: auto
animate: true
legend: true
history: true
idle_threshold: 15

solar:
  name: Fotowoltaika łącznie
  power: sensor.pv_total_power
  energy: sensor.pv_total_energy_today
  # strona AC — z samego falownika, nie z licznika (licznik widzi cały dom, nie falownik)
  voltage: sensor.falownik_1_napiecie_pradu_zmiennego
  current: sensor.falownik_1_prad_zmienny
  frequency: sensor.falownik_1_czestotliwosc
  status: sensor.falownik_1_status_message
  # moc znamionowa AC obu falowników — daje procent wykorzystania przy sumie
  max_power: 24900
  strings:
    - name: Falownik 1
      icon: panel
      power: sensor.solarnet_1_fotowoltaika
      energy: sensor.falownik_1_energia_z_dnia   # 4237 Wh → karta przeliczy na kWh
      voltage: sensor.falownik_1_napiecie_pradu_stalego
      current: sensor.falownik_1_prad_staly
      max_power: 14900
    - name: Falownik 2
      icon: panel
      power: sensor.solarnet_2_fotowoltaika
      energy: sensor.falownik_2_energia_z_dnia
      voltage: sensor.falownik_2_napiecie_pradu_stalego
      current: sensor.falownik_2_prad_staly
      max_power: 10000

grid:
  name: Sieć
  # Dwie osobne encje zamiast jednej ze znakiem — zero ryzyka pomyłki kierunku.
  # Fronius wystawia je gotowe: import 0 W / export 2734 W przy nadwyżce.
  power_import: sensor.solarnet_1_power_grid_import
  power_export: sensor.solarnet_1_power_grid_export
  # Alternatywa (jedna encja ze znakiem, ujemna = oddawanie — bez `invert`):
  #   power: sensor.smart_meter_63a_realna_moc
  #
  # UWAGA: to liczniki od uruchomienia instalacji (38,66 / 35,21 MWh), nie dzienne.
  # Fronius nie ma dziennych liczników sieci — trzeba zrobić utility_meter (patrz niżej).
  energy_import: sensor.smart_meter_63a_energia_rzeczywista_plus
  energy_export: sensor.smart_meter_63a_energia_rzeczywista_minus

house:
  name: Dom
  # Bez `power:` węzeł domu sumuje moc WSZYSTKICH urządzeń z grup poniżej.
  #
  # Alternatywy, gdyby suma odbiorników była niepełna:
  #   power: sensor.solarnet_1_obciazenie   → realne zużycie całego domu z Froniusa
  #                                           (SPRAWDŹ znak; jeśli ujemny, dodaj `invert: true`)
  #   power: auto                           → bilans: PV + sieć − akumulator
  #
  # NIE UŻYWAJ sensor.solarnet_1_power_load_consumed — u Ciebie zwraca stałe 0 W.
  #
  # Fronius liczy autonomię sam, więc nie musimy jej wyliczać z bilansu:
  self_sufficiency: sensor.solarnet_1_autonomia_wzgledna
  # licznik od uruchomienia instalacji — dla „dzisiaj" zrób utility_meter (patrz niżej)
  energy: sensor.smart_meter_63a_energia_rzeczywista_zuzyta

groups:
  - name: Wentylacja
    icon: fan
    expanded: true
    devices:
      - name: Rekuperator
        icon: fan
        # power: sensor.rekuperator_moc
        energy: sensor.rekuperator_dzis

  - name: Ogrzewanie
    icon: climate
    expanded: true
    devices:
      - name: Pompa ciepła
        icon: climate
        power: sensor.shellypro3em_fce8c0daec00_power
        energy: sensor.shellypro3em_fce8c0daec00_energy

  # Każdy moduł Sonoff Dual R3 ma własny wiersz z SUMĄ obu kanałów,
  # a po kliknięciu rozwija kanały jako osobne pozycje z własną mocą i energią.
  # Nazwy „Kanał 1/2" możesz podmienić na opisowe (np. „Napowietrzanie stawu”).
  - name: Gniazdka Sonoff
    icon: plug
    devices:
      - name: Sonoff 1
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_1_power_1
            energy: sensor.sonoff_dual_r3_1_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_1_power_2
            energy: sensor.sonoff_dual_r3_1_energy_2_daily
      - name: Sonoff 2
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_2_power_1
            energy: sensor.sonoff_dual_r3_2_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_2_power_2
            energy: sensor.sonoff_dual_r3_2_energy_2_daily
      - name: Sonoff 4
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_4_power_1
            energy: sensor.sonoff_dual_r3_4_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_4_power_2
            energy: sensor.sonoff_dual_r3_4_energy_2_daily
      - name: Sonoff 5
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_5_power_1
            energy: sensor.sonoff_dual_r3_5_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_5_power_2
            energy: sensor.sonoff_dual_r3_5_energy_2_daily
      - name: Sonoff 8
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_8_power_1
            energy: sensor.sonoff_dual_r3_8_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_8_power_2
            energy: sensor.sonoff_dual_r3_8_energy_2_daily
      - name: Sonoff 9
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_9_power_1
            energy: sensor.sonoff_dual_r3_9_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_9_power_2
            energy: sensor.sonoff_dual_r3_9_energy_2_daily
      - name: Sonoff 10
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_10_power_1
            energy: sensor.sonoff_dual_r3_10_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_10_power_2
            energy: sensor.sonoff_dual_r3_10_energy_2_daily
      - name: Sonoff 11
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_11_power_1
            energy: sensor.sonoff_dual_r3_11_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_11_power_2
            energy: sensor.sonoff_dual_r3_11_energy_2_daily
      - name: Sonoff 12
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_12_power_1
            energy: sensor.sonoff_dual_r3_12_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_12_power_2
            energy: sensor.sonoff_dual_r3_12_energy_2_daily
      - name: Sonoff 13
        icon: plug
        devices:
          - name: Kanał 1
            icon: plug
            power: sensor.sonoff_dual_r3_13_power_1
            energy: sensor.sonoff_dual_r3_13_energy_1_daily
          - name: Kanał 2
            icon: plug
            power: sensor.sonoff_dual_r3_13_power_2
            energy: sensor.sonoff_dual_r3_13_energy_2_daily

grid_options:
  columns: full
  rows: auto
# ---------------------------------------------------------------------------
# BRAKUJĄCE DANE — do configuration.yaml, potem podmień encje w `grid:` wyżej.
#
# Fronius wystawia liczniki sieci tylko od uruchomienia instalacji (38,66 MWh),
# więc „↓ dzisiaj / ↑ dzisiaj" wymaga własnych liczników dobowych:
#
# utility_meter:
#   grid_import_daily:
#     source: sensor.smart_meter_63a_energia_rzeczywista_plus
#     cycle: daily
#   grid_export_daily:
#     source: sensor.smart_meter_63a_energia_rzeczywista_minus
#     cycle: daily
#   dom_zuzycie_daily:
#     source: sensor.smart_meter_63a_energia_rzeczywista_zuzyta
#     cycle: daily
#
# Po restarcie:
#   grid.energy_import: sensor.grid_import_daily
#   grid.energy_export: sensor.grid_export_daily
#   house.energy:       sensor.dom_zuzycie_daily
# ---------------------------------------------------------------------------
